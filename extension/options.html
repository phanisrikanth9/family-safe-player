<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Family Safe Player · saved titles</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main>
      <h1><img src="icons/icon48.png" alt="" width="32" height="32" /> Family Safe Player</h1>

      <section id="importBox" class="card" hidden>
        <h2>Load a skip file for <span id="impTitle"></span></h2>
        <p class="muted" id="impSite"></p>
        <label class="file">
          <input type="file" id="file" accept=".json,application/json" />
          Choose .skips.json file
        </label>
        <p id="impMsg"></p>
      </section>

      <section class="card">
        <h2>Saved titles</h2>
        <p class="muted">Scenes you marked with <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> or loaded from skip files.</p>
        <table>
          <thead>
            <tr><th>Title</th><th>Where</th><th>Scenes</th><th></th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
        <p id="empty" class="muted" hidden>Nothing saved yet.</p>
      </section>
    </main>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
